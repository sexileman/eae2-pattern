org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod
## mod_id is the in-game namespace, so it stays lowercase and hyphen free.
## mod_artifact is the name humans see: the jar file name and the repository.
mod_id=eae2_pattern
mod_artifact=eae2-pattern
mod_name=EAE2 Pattern
mod_license=MIT
mod_authors=sexileman
mod_group_id=io.github.sexileman.eae2pattern
mod_description=AE2 pattern tools with JEI recipe filtering, batch encoding and machine-bound wildcard patterns.
mod_issues=https://github.com/sexileman/eae2-pattern/issues

## Version
## Calendar version: YYYY.M.SEQUENCE; development branches append -beta.N.
## See VERSIONING.md. Minecraft version remains in the jar base name.
## Release jar: <mod_artifact>-<minecraft_version>-<mod_version>.jar
mod_version=2026.11.2-beta.2

## Dependencies
ae2_version=15.2.16
ae2_version_range=[15.2.0,16.0.0)
jei_version=15.20.0.106
jei_version_range=[15.20.0,16.0.0)
