plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

/*
 * Version scheme: plain semantic versioning, MAJOR.MINOR.PATCH.
 *
 *   MAJOR  breaks something players depend on (config keys renamed, network
 *          protocol changed, generated patterns stop working)
 *   MINOR  new features, backwards compatible (1.0.0 -> 1.1.0)
 *   PATCH  bug fixes only (1.1.0 -> 1.1.1)
 *
 * The Minecraft version is deliberately not part of it: it lives in the branch
 * name (`1.20.1`, `1.21`, ...) and in the dependency ranges in mods.toml, so the
 * same mod version can be rebuilt for another Minecraft release without
 * inventing a new numbering scheme. Bump mod_version in gradle.properties by
 * hand and tag the release (v1.1.0) in git.
 */
def modVersion = mod_version

version = modVersion
group = mod_group_id

base {
    archivesName = mod_artifact
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Applied Energistics 2 (compile against the full jar: we also use menu/logic classes that are not in the -api jar)
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    // JEI (optional at runtime, but needed to compile the client plugin)
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            jei_version_range      : jei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issues             : mod_issues
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors,
                'MixinConfigs'           : 'eae2_pattern.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Print the version that just got built, so a release log is self explanatory.
tasks.named('build').configure {
    doLast {
        logger.lifecycle("EAE2 Pattern ${modVersion}")
    }
}

tasks.register('printVersion') {
    group = 'help'
    description = 'Prints the version this checkout would build.'
    def preview = modVersion
    doLast {
        println preview
    }
}

// Headless regression checks use the same mapped Minecraft classes as production, without another test library.
tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.sexileman.eae2pattern.RegressionChecks'
    enableAssertions = true
}
tasks.named('check').configure { dependsOn 'regressionTest' }

tasks.register('compatibilityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.sexileman.eae2pattern.CompatibilityContracts'
    args(project.findProperty('compatModsDir') ?: '../others/mods')
}
