plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

/* Calendar version: YYYY.M.SEQUENCE, development builds: YYYY.M.SEQUENCE-beta.N.
 * Set mod_version in gradle.properties. See VERSIONING.md.
 */
def modVersion = mod_version

version = modVersion
group = mod_group_id

base {
    // Stable artifact contract: <mod_artifact>-<minecraft_version>-<mod_version>.jar
    archivesName = "${mod_artifact}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Applied Energistics 2 (compile against the full jar: we also use menu/logic classes that are not in the -api jar)
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    testImplementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    // JEI (optional at runtime, but needed to compile the client plugin)
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    testImplementation fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            jei_version_range      : jei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issues             : mod_issues
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors,
                'MixinConfigs'           : 'eae2_pattern.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Print the version that just got built, so a release log is self explanatory.
tasks.named('build').configure {
    doLast {
        logger.lifecycle("EAE2 Pattern ${modVersion}")
    }
}

tasks.register('printVersion') {
    group = 'help'
    description = 'Prints the version this checkout would build.'
    def preview = modVersion
    doLast {
        println preview
    }
}

// Headless regression checks use the same mapped Minecraft classes as production, without another test library.
tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.sexileman.eae2pattern.RegressionChecks'
    enableAssertions = true
}
tasks.named('check').configure { dependsOn 'regressionTest' }

tasks.register('compatibilityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.sexileman.eae2pattern.CompatibilityContracts'
    args(project.findProperty('compatModsDir') ?: '../others/mods')
}

tasks.register('universalCompatibilityTest', JavaExec) {
    dependsOn testClasses, 'reobfJar'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.sexileman.eae2pattern.UniversalWildcardContracts'
    doFirst {
        args(tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath,
             project.findProperty('compatModsDir') ?: '../others/mods')
    }
}

// Stage the canonical release name without an ambiguous generic alias.
tasks.register('stageRelease') {
    group = 'build'
    description = 'Builds and copies the canonical Minecraft-versioned jar and SHA-256 to dist.'
    dependsOn 'build'
    def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file releaseJar
    def releaseName = tasks.named('jar', Jar).flatMap { it.archiveFileName }
    outputs.file releaseName.map { layout.projectDirectory.file("dist/${it}") }
    outputs.file releaseName.map { layout.projectDirectory.file("dist/${it}.sha256") }
    doLast {
        def sourceJar = releaseJar.get().asFile
        def targetJar = layout.projectDirectory.file("dist/${sourceJar.name}").asFile
        targetJar.parentFile.mkdirs()
        java.nio.file.Files.copy(sourceJar.toPath(), targetJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        targetJar.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        new File(targetJar.parentFile, targetJar.name + '.sha256').text = digest.digest().encodeHex().toString() + '\n'
        logger.lifecycle("Release: ${targetJar}")
    }
}

apply from: "gradle/cycle-format.gradle"
